services:
  db:
    image: postgres:16-alpine
    container_name: nexo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports:
      - "5462:5432"
    volumes:
      - nexo_db_data:/var/lib/postgresql/data

volumes:
  nexo_db_data:
